[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shoppybot"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = ["platformdirs==4.10.0"]

[project.optional-dependencies]
web = [
    "fastapi==0.115.8",
    "uvicorn[standard]==0.30.6",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
]

[project.scripts]
shoppybot = "core.service:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "plugins*", "notifications*", "web*"]
exclude = ["tests*"]

[tool.setuptools]
py-modules = ["models", "logger", "config", "utils", "main"]
include-package-data = true

# The globs below are what actually ship the data files; include-package-data alone
# includes nothing without a MANIFEST.in or an SCM plugin. Keep them narrow so an
# untracked local file cannot be swept into a published wheel. static/vendor/* is a
# separate entry because static/* does not descend into subdirectories.
[tool.setuptools.package-data]
"core.sounds" = ["*.wav", "*.mp3"]
web = ["static/*", "static/vendor/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
