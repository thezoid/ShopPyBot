name: Bug Report
description: Report a bug or unexpected behavior in ShopPyBot.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerabilities must NOT be filed here.**
        Follow the private disclosure process in [SECURITY.md](../SECURITY.md) instead.
        Public issues expose details before a fix is available.

  - type: textarea
    id: bug_description
    attributes:
      label: Bug Description
      description: What happened? What did you expect to happen?
      placeholder: Describe the bug clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide the exact steps to reproduce the bug.
      placeholder: |
        1. Configure config.yml with ...
        2. Run python main.py
        3. Observe ...
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform / Plugin Affected
      description: Which retailer plugin is involved?
      options:
        - Amazon
        - BestBuy
        - Other (describe below)
    validations:
      required: true

  - type: textarea
    id: expected_vs_actual
    attributes:
      label: Expected vs. Actual Behavior
      description: What did you expect to happen? What actually happened?
      placeholder: |
        Expected: The bot should add the item to cart.
        Actual: The bot raised a TimeoutException.
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and Python version (e.g., Windows 11 / Python 3.12.3).
      placeholder: "Windows 11 / Python 3.12.3"
    validations:
      required: true

  - type: checkboxes
    id: no_secrets
    attributes:
      label: Credentials and Secrets
      options:
        - label: >-
            I confirm that no credentials, passwords, API keys, or other secrets
            are included in any logs, screenshots, or text pasted into this report.
          required: true
