version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

    ignore:
      # fastapi 0.141.x and its uvicorn pairing unregister /api/events, which kills the
      # dashboard SSE channel. Proven, not suspected: PR #29 shipped this bump and
      # tests/test_sse.py::test_lifespan_creates_hub_and_registers_route failed on BOTH
      # runners (Actions run 31988900943). The same break arrived three times as #21,
      # #25 and #29, each replacement opening within seconds of the last one closing.
      # Upgrading needs dedicated work on the SSE lifespan registration, not a bump.
      # Scoped to minor+patch ONLY so majors and security advisories still surface.
      - dependency-name: "fastapi"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "uvicorn"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # starlette is a FLOOR, not a pin: it exists only to match the declared minimum
      # of the held-back fastapi above. Measured from installed metadata, not from a
      # comment: fastapi 0.115.8 requires starlette<0.46.0,>=0.40.0. PR #34 proposed
      # raising the floor to >=1.6.0, which makes `pip install .[web]` UNSATISFIABLE
      # outright, a harder failure than the SSE break. Only the incompatible range is
      # ignored, so starlette updates below 0.46.0 and its security advisories in that
      # range still surface. Widen this bound in the same change that lifts fastapi,
      # never before.
      - dependency-name: "starlette"
        versions: [">=0.46.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
