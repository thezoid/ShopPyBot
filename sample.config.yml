# ShopPyBot config template. Copy to config.yml and customize.
# Credentials are NOT stored here: they are read from environment variables.
# See README.md "Credentials" section for the full env-var list.

selenium:
  driver_path: ./chromedriver.exe

debug:
  logging_level: 5
  test_mode: true

open_browser: false

platforms:
  amazon:
    enabled: true
    # Credentials loaded from env vars:
    #   SHOPBOT_PLATFORMS__AMAZON__CREDENTIALS__EMAIL
    #   SHOPBOT_PLATFORMS__AMAZON__CREDENTIALS__PASSWORD
    credentials:
      email: ""
      password: ""
  bestbuy:
    enabled: true
    # Credentials loaded from env vars:
    #   SHOPBOT_PLATFORMS__BESTBUY__CREDENTIALS__EMAIL
    #   SHOPBOT_PLATFORMS__BESTBUY__CREDENTIALS__PASSWORD
    # CVV prompted at runtime via getpass.
    # Headless opt-in (trusted infra only): set SHOPBOT_ALLOW_CVV_ENV=true and SHOPBOT_BESTBUY_CVV.
    credentials:
      email: ""
      password: ""

available:
  items: []

# Phase 5: notification channels. Each channel defaults to disabled except sound.
# Secrets are read from env vars, NEVER from this file (SEC-01).
#   Discord: SHOPBOT_DISCORD_WEBHOOK_URL
#   Email:   SHOPBOT_SMTP_PASSWORD
#   SMS:     SHOPBOT_TWILIO_ACCOUNT_SID, SHOPBOT_TWILIO_AUTH_TOKEN,
#            SHOPBOT_TWILIO_FROM, SHOPBOT_ENABLE_SMS
notifications:
  restock_window_seconds: 600   # dedup: one notification per item per 10 minutes
  sound:
    enabled: true
  discord:
    enabled: false              # set true AND export SHOPBOT_DISCORD_WEBHOOK_URL
  email:
    enabled: false              # set true AND export SHOPBOT_SMTP_PASSWORD
    from_addr: null
    to_addr: null
    smtp_host: null
    smtp_port: 587              # 587=STARTTLS (default), 465=SMTPS
    smtp_user: null
  sms:
    enabled: false              # Set to true AND export SHOPBOT_ENABLE_SMS=true to enable.
                                # See SECURITY.md for billing-risk warning (Twilio charges per message).
    to: null
